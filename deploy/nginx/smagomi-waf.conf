upstream smagomi_app {
  server 127.0.0.1:3000;
  keepalive 64;
}

limit_req_zone $binary_remote_addr zone=smagomi_rl:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=smagomi_conn:10m;

# JSON access log format for analytics
log_format smagomi_json escape=json
  '{'
  '"time":"$time_iso8601",'
  '"remote_addr":"$remote_addr",'
  '"x_forwarded_for":"$proxy_add_x_forwarded_for",'
  '"request_id":"$request_id",'
  '"method":"$request_method",'
  '"uri":"$request_uri",'
  '"status":$status,'
  '"bytes":$body_bytes_sent,'
  '"referer":"$http_referer",'
  '"user_agent":"$http_user_agent",'
  '"request_time":$request_time,'
  '"upstream_time":"$upstream_response_time"'
  '}';

server {
  listen 80;
  server_name smagomi.example.com;

  location /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name smagomi.example.com;

  ssl_certificate /etc/letsencrypt/live/smagomi.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/smagomi.example.com/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  client_max_body_size 10m;

  limit_req zone=smagomi_rl burst=20 nodelay;
  limit_conn smagomi_conn 30;

  access_log /var/log/nginx/smagomi-access.json smagomi_json;
  error_log /var/log/nginx/smagomi-error.log warn;

  # Basic WAF-style filters
  if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS)$) {
    return 405;
  }

  if ($request_uri ~* "(?:\.\./|\.\.\\|%2e%2e%2f|%2e%2e%5c)") {
    return 403;
  }

  if ($request_uri ~* "(?:/etc/passwd|/proc/self|/wp-admin|/wp-login|/xmlrpc.php)") {
    return 403;
  }

  if ($query_string ~* "(?:union\s+select|select.+from|drop\s+table|insert\s+into|update\s+.+set|<script|%3cscript)") {
    return 403;
  }

  location / {
    proxy_pass http://smagomi_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
