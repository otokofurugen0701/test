upstream smagomi_app {
  server 127.0.0.1:3000;
  keepalive 64;
}

server {
  listen 80;
  server_name smagomi.example.com;

  location /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name smagomi.example.com;

  ssl_certificate /etc/letsencrypt/live/smagomi.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/smagomi.example.com/privkey.pem;

  client_max_body_size 10m;

  location / {
    proxy_pass http://smagomi_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
