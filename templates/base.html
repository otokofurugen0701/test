<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}SmartGomi Admin{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="topbar">
    <div class="container row between">
      <div class="brand">SmartGomi MVP</div>
      {% if session.get("admin_user_id") %}
      <nav class="nav row">
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('locations_page') }}">Locations</a>
        <a href="{{ url_for('logs_page') }}">Logs</a>
      </nav>
      <form action="{{ url_for('logout') }}" method="post">
        <button class="btn ghost" type="submit">Logout</button>
      </form>
      {% endif %}
    </div>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-stack">
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
