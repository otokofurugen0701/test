<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solitaire</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Solitaire (Klondike)</h1>
      <p class="subtitle">Click a card to select, then click a pile to move.</p>
    </header>

    <main class="board">
      <section class="top-row">
        <div class="stock-waste">
          <div id="stock" class="pile stock" role="button" aria-label="Stock"></div>
          <div id="waste" class="pile waste" role="button" aria-label="Waste"></div>
        </div>
        <div id="foundations" class="foundations" aria-label="Foundations"></div>
      </section>

      <section id="tableau" class="tableau" aria-label="Tableau"></section>
    </main>

    <footer class="controls">
      <button id="new-game" type="button">New Game</button>
      <div id="message" class="message" aria-live="polite"></div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
